[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysai-agent"
version = "0.3.0"
description = "Local Linux administration agent with a guarded tool layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.9"]

[project.scripts]
sysai = "sysai.cli:main"

[tool.setuptools.packages.find]
include = ["sysai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
